<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07111d">
<title>JIBS Barcode Scanner</title>
<style>
*{box-sizing:border-box}
:root{--bg:#07111d;--panel:#0e1d2d;--line:#29445f;--text:#f4f8fc;--muted:#91a8be;--ok:#17a96b;--cyan:#58c8ff}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
header{padding:18px 18px 14px;border-bottom:1px solid #1b3045;background:#091522}
header b{font-size:20px;letter-spacing:.4px} header small{display:block;color:var(--muted);margin-top:4px}
main{max-width:650px;margin:auto;padding:16px}
.camera{position:relative;overflow:hidden;border:1px solid var(--line);border-radius:18px;background:#000;aspect-ratio:3/4}
video{width:100%;height:100%;object-fit:cover}
.shade{position:absolute;inset:0;box-shadow:inset 0 0 0 999px rgba(0,0,0,.20);pointer-events:none}
.frame{position:absolute;left:7%;right:7%;top:35%;height:25%;border:3px solid rgba(255,255,255,.95);border-radius:10px;box-shadow:0 0 18px rgba(88,200,255,.25);pointer-events:none}
.scanline{position:absolute;left:9%;right:9%;top:47%;height:2px;background:var(--cyan);box-shadow:0 0 9px var(--cyan);animation:scan 2s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-70px);opacity:.45}50%{transform:translateY(70px);opacity:1}}
.status{margin-top:14px;padding:17px;border:1px solid var(--line);background:var(--panel);border-radius:14px;text-align:center}
.status strong{display:block;font-size:22px}.status span{display:block;color:var(--muted);margin-top:6px;font-size:14px}
.status.ok{background:#0b3828;border-color:var(--ok)}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:11px}
button{border:1px solid var(--line);background:#13283d;color:#fff;border-radius:11px;padding:13px;font-weight:800;font-size:15px}
button.primary{background:#eaf7ff;color:#07111d;border-color:#eaf7ff}
.info{margin-top:12px;padding:12px 14px;border:1px solid #1d344a;border-radius:12px;color:var(--muted);font-size:13px;line-height:1.55}
.last{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;word-break:break-all;color:#fff!important}
.flash{position:fixed;inset:0;background:rgba(23,169,107,.26);pointer-events:none;opacity:0;z-index:20}
.flash.on{animation:flash .45s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}

.scanlog{margin-top:14px;border:1px solid #1d344a;border-radius:12px;overflow:hidden;background:#0b1826}
.scanlog-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-bottom:1px solid #1d344a}
.scanlog-head b{font-size:15px}.scanlog-head button{width:auto;margin:0;padding:8px 10px;font-size:12px}
.scanlog-list{max-height:300px;overflow:auto}
.scanlog-row{padding:11px 14px;border-bottom:1px solid #172b3e}.scanlog-row:last-child{border-bottom:0}
.scanlog-code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-weight:800;word-break:break-all;font-size:13px}
.scanlog-time{color:var(--muted);font-size:12px;margin-top:5px}
.scanlog-empty{padding:20px;text-align:center;color:var(--muted);font-size:13px}

.boarding{margin-top:14px;border:1px solid #1d344a;border-radius:12px;overflow:hidden;background:#0b1826}
.boarding-head{padding:13px 14px;border-bottom:1px solid #1d344a}
.boarding-head b{font-size:15px}
.boarding-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:12px 14px;border-bottom:1px solid #1d344a}
.boarding-stat{background:#102235;border:1px solid #213c55;border-radius:10px;padding:12px;text-align:center}
.boarding-stat small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.boarding-stat strong{font-size:22px}
.seat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;padding:12px 14px}
.seat-chip{padding:8px 3px;border:1px solid #29445f;border-radius:7px;text-align:center;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:800;background:#102235}
.seat-chip.boarded{border-color:var(--ok);background:#0b3828}
.boarding-list{max-height:260px;overflow:auto;border-top:1px solid #1d344a}
.boarding-row{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-bottom:1px solid #172b3e}
.boarding-row:last-child{border-bottom:0}.boarding-row b{font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.boarding-row span{font-size:12px;color:var(--muted)}
.dup{background:#431a1e!important;border-color:#b64b53!important}

.mode-select{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:12px}.mode-btn.active{background:#eaf7ff;color:#07111d;border-color:#eaf7ff}.scanner-panel{display:none;border:1px solid var(--line);border-radius:18px;background:#0b1826;padding:24px 18px;text-align:center;min-height:240px;align-items:center;justify-content:center;flex-direction:column}.scanner-panel.show{display:flex}.scanner-icon{font-size:46px;margin-bottom:12px}.scanner-input{position:absolute;left:-9999px;opacity:0}.camera.hidden{display:none}.camera-controls.hidden{display:none}
</style>
</head>
<body>
<div class="flash" id="flash"></div>
<header><b>JIBS BARCODE SCANNER</b><small>BARCODE · QR CODE · 2D CODE</small></header>
<main>
  <div class="mode-select">
    <button class="mode-btn active" id="cameraModeBtn">휴대폰 카메라로 스캔하기</button>
    <button class="mode-btn" id="scannerModeBtn">바코드 스캐너로 스캔하기</button>
  </div>
  <div class="scanner-panel" id="scannerPanel">
    <div class="scanner-icon">▥</div>
    <strong style="font-size:20px">외부 바코드 스캐너 대기 중</strong>
    <span style="color:var(--muted);margin-top:8px;line-height:1.55">휴대폰에 스캐너를 연결한 뒤 바코드를 스캔하세요.<br>입력값이 들어오면 자동으로 처리합니다.</span>
    <input id="scannerInput" class="scanner-input" autocomplete="off" autocapitalize="off" spellcheck="false">
    <button id="focusScannerBtn" style="margin-top:18px">스캐너 입력 다시 활성화</button>
  </div>
  <div class="camera" id="cameraBox">
    <video id="video" playsinline muted></video>
    <div class="shade"></div><div class="frame"></div><div class="scanline"></div>
  </div>
  <div class="status" id="status">
    <strong>카메라 준비 중</strong>
    <span>카메라 사용 권한을 허용해 주세요.</span>
  </div>
  <div class="controls camera-controls" id="cameraControls">
    <button class="primary" id="startBtn">카메라 시작</button>
    <button id="switchBtn">카메라 전환</button>
  </div>
  <div class="info">
    바코드 또는 QR코드가 인식되면 <b>업로드한 효과음</b>을 재생합니다.<br>기존 TTS 안내와 기존 효과음은 사용하지 않습니다.<br>
    최근 인식: <span class="last" id="last">없음</span>
  </div>
  
  <div class="boarding">
    <div class="boarding-head"><b>탑승 현황</b></div>
    <div class="boarding-stats">
      <div class="boarding-stat"><small>탑승 인원</small><strong id="boardedCount">0</strong></div>
      <div class="boarding-stat"><small>탑승률</small><strong id="boardingRate">0%</strong></div>
    </div>
    <div style="padding:0 14px 10px">
      <label style="display:block;color:var(--muted);font-size:11px;margin-bottom:5px">총 발권 좌석 수 (탑승률 계산 기준)</label>
      <input id="totalSeatsInput" type="number" min="1" inputmode="numeric" placeholder="예: 201" style="width:100%;padding:10px;border-radius:8px;border:1px solid #29445f;background:#102235;color:#fff">
    </div>
    <div style="padding:11px 14px 0;color:var(--muted);font-size:12px">탑승 확인 좌석</div>
    <div class="seat-grid" id="seatGrid"></div>
    <div class="boarding-list" id="boardingList"></div>
  </div>

  <div class="scanlog">
    <div class="scanlog-head">
      <div><b>스캔 기록</b> <span id="logCount" style="color:var(--muted);font-size:12px">0건</span></div>
      <button id="clearLog">기록 초기화</button>
    </div>
    <div class="scanlog-list" id="scanLogList"></div>
  </div>
</main>

<!-- BarcodeDetector 미지원 브라우저를 위한 ZXing fallback -->
<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
const video=document.getElementById("video");
const statusEl=document.getElementById("status");
const ding=document.getElementById("ding");
const lastEl=document.getElementById("last");
let stream=null, detector=null, zxingReader=null, scanning=false, locked=false;
let facing="environment", raf=0, lastValue="", lastTime=0;

function status(title,sub,ok=false){
  statusEl.className="status"+(ok?" ok":"");
  statusEl.innerHTML=`<strong>${title}</strong><span>${sub||""}</span>`;
}

let audioUnlocked=false;
let ttsUnlocked=false;

async function unlockMobileAudio(){
  try{
    ding.muted=true; ding.currentTime=0;
    await ding.play(); ding.pause(); ding.currentTime=0; ding.muted=false;
    audioUnlocked=true;
  }catch(e){ console.warn("audio unlock failed",e); ding.muted=false; }
}



const LOG_KEY="jibs_mobile_scan_history_v1";
function loadLog(){
  try{return JSON.parse(localStorage.getItem(LOG_KEY)||"[]")}catch(e){return []}
}
function saveLog(list){
  localStorage.setItem(LOG_KEY,JSON.stringify(list));
}
function escHtml(s){
  return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatScanTime(d){
  const z=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}.${z(d.getMonth()+1)}.${z(d.getDate())} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`;
}
function addScanLog(value,format=""){
  const list=loadLog();
  list.unshift({
    value:String(value),
    format:String(format||""),
    time:formatScanTime(new Date()),
    timestamp:Date.now()
  });
  saveLog(list.slice(0,1000));
  renderScanLog();
}
function renderScanLog(){
  const list=loadLog();
  document.getElementById("logCount").textContent=`${list.length}건`;
  document.getElementById("scanLogList").innerHTML=list.length?list.map(x=>`
    <div class="scanlog-row">
      <div class="scanlog-code">${escHtml(x.value)}</div>
      <div class="scanlog-time">${x.format?escHtml(x.format.toUpperCase())+" · ":""}${escHtml(x.time)}</div>
    </div>`).join(""):`<div class="scanlog-empty">아직 저장된 스캔 기록이 없습니다.</div>`;
}


const BOARDING_KEY="jibs_mobile_boarding_v1";
const JIBS_SUFFIX="JIBSJIBS00000JIBS";

function loadBoarding(){
  try{return JSON.parse(localStorage.getItem(BOARDING_KEY)||"{}")}catch(e){return {}}
}
function saveBoarding(v){localStorage.setItem(BOARDING_KEY,JSON.stringify(v))}
function parseJibsSeat(value){
  let v=String(value||"").replace(/[\r\n\t\s]/g,"").trim();
  v=v.replace(/^\]C[0-9]/i,"");
  if(!v.toUpperCase().endsWith(JIBS_SUFFIX))return null;
  const seat=v.slice(0,-JIBS_SUFFIX.length).trim();
  return seat||null;
}
function renderBoarding(){
  const data=loadBoarding();
  const rows=Object.values(data).sort((a,b)=>b.timestamp-a.timestamp);
  document.getElementById("boardedCount").textContent=rows.length;

  const total=parseInt(localStorage.getItem("jibs_total_seats")||"0",10);
  document.getElementById("boardingRate").textContent=total?`${Math.min(100,Math.round(rows.length/total*100))}%`:"—";

  const sorted=[...rows].sort((a,b)=>String(a.seat).localeCompare(String(b.seat),undefined,{numeric:true}));
  document.getElementById("seatGrid").innerHTML=sorted.length
    ? sorted.map(x=>`<div class="seat-chip boarded">${escHtml(x.seat)}</div>`).join("")
    : `<div style="grid-column:1/-1;color:var(--muted);font-size:12px">아직 탑승 확인 좌석이 없습니다.</div>`;
  document.getElementById("boardingList").innerHTML=rows.length
    ? rows.map(x=>`<div class="boarding-row"><b>${escHtml(x.seat)}</b><span>${escHtml(x.time)}</span></div>`).join("")
    : `<div class="scanlog-empty">탑승 기록이 없습니다.</div>`;
}
function playUploadedSound(){
  try{
    ding.pause(); ding.currentTime=0; ding.muted=false; ding.volume=1;
    const p=ding.play(); if(p&&p.catch)p.catch(e=>console.warn("sound blocked",e));
  }catch(e){console.warn("sound error",e)}
}
function duplicateAlert(value){
  locked=true;
  statusEl.className="status dup";
  statusEl.innerHTML=`<strong>이미 스캔되었습니다</strong><span>${escHtml(value)}</span>`;
  playUploadedSound();
  setTimeout(()=>{
    locked=false;
    status("스캔 대기","바코드 또는 QR코드를 비춰 주세요.");
  },1000);
}
function playSuccess(value,format=""){
  const now=Date.now();
  const seat=parseJibsSeat(value);
  const boarding=loadBoarding();

  // 좌석형 JIBS CODE128은 좌석 기준으로 영구 중복 검사.
  // 그 외 바코드는 기존 스캔 로그 기준으로 중복 검사.
  if(seat && boarding[String(seat).toUpperCase()]){
    duplicateAlert(value);return;
  }
  const logs=loadLog();
  if(!seat && logs.some(x=>x.value===String(value))){
    duplicateAlert(value);return;
  }
  if(locked)return;

  lastValue=value;lastTime=now;locked=true;
  lastEl.textContent=value;
  addScanLog(value,format);

  if(seat){
    const time=formatScanTime(new Date());
    boarding[String(seat).toUpperCase()]={seat,time,timestamp:Date.now(),raw:String(value)};
    saveBoarding(boarding);
    renderBoarding();
  }

  status("✓ 인식되었습니다",seat?`좌석 ${seat}`:value,true);
  const flash=document.getElementById("flash");
  flash.classList.remove("on");void flash.offsetWidth;flash.classList.add("on");
  if(navigator.vibrate)navigator.vibrate(80);

  playUploadedSound();

  setTimeout(()=>{
    locked=false;
    status("스캔 대기","바코드 또는 QR코드를 비춰 주세요.");
  },1000);
}

async function nativeLoop(){
  if(!scanning || !detector)return;
  if(!locked && video.readyState>=2){
    try{
      const codes=await detector.detect(video);
      if(codes.length){
        const c=codes[0];
        if(c?.rawValue) playSuccess(c.rawValue,c.format||"");
      }
    }catch(e){}
  }
  raf=requestAnimationFrame(nativeLoop);
}
async function startNative(){
  if(!("BarcodeDetector" in window))return false;
  try{
    const supported=await BarcodeDetector.getSupportedFormats();
    if(!supported.length)return false;
    detector=new BarcodeDetector({formats:supported});
    nativeLoop();
    return true;
  }catch(e){return false}
}
async function startZXing(){
  if(!window.ZXing)return false;
  try{
    zxingReader=new ZXing.BrowserMultiFormatReader(undefined,500);
    await zxingReader.decodeFromVideoElementContinuously(video,(result,err)=>{
      if(result && !locked) playSuccess(result.getText(),result.getBarcodeFormat ? String(result.getBarcodeFormat()) : "");
    });
    return true;
  }catch(e){console.warn(e);return false}
}
async function stopCamera(){
  scanning=false;
  cancelAnimationFrame(raf);
  if(zxingReader){try{zxingReader.reset()}catch(e){} zxingReader=null}
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}
  video.srcObject=null;
}
async function startCamera(){
  await stopCamera();
  status("카메라 준비 중","잠시 기다려 주세요.");
  try{
    stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:facing},width:{ideal:1920},height:{ideal:1080}},
      audio:false
    });
    video.srcObject=stream; await video.play(); scanning=true;

    const nativeOK=await startNative();
    if(!nativeOK){
      const zxingOK=await startZXing();
      if(!zxingOK) throw new Error("지원되는 바코드 인식 엔진이 없습니다.");
    }
    status("스캔 대기","바코드 또는 QR코드를 비춰 주세요.");
  }catch(e){
    console.error(e);
    status("카메라를 시작할 수 없습니다","HTTPS 접속 및 카메라 권한을 확인해 주세요.");
  }
}
let scanMode="camera";
const cameraBox=document.getElementById("cameraBox");
const cameraControls=document.getElementById("cameraControls");
const scannerPanel=document.getElementById("scannerPanel");
const scannerInput=document.getElementById("scannerInput");
const cameraModeBtn=document.getElementById("cameraModeBtn");
const scannerModeBtn=document.getElementById("scannerModeBtn");
function setMode(mode){
  scanMode=mode;
  const isCamera=mode==="camera";
  cameraModeBtn.classList.toggle("active",isCamera);
  scannerModeBtn.classList.toggle("active",!isCamera);
  cameraBox.classList.toggle("hidden",!isCamera);
  cameraControls.classList.toggle("hidden",!isCamera);
  scannerPanel.classList.toggle("show",!isCamera);
  if(!isCamera){ stopCamera(); unlockMobileAudio(); setTimeout(()=>scannerInput.focus(),100); status("스캐너 대기","외부 바코드 스캐너로 스캔해 주세요."); }
  else status("시작 준비","‘카메라 시작’ 버튼을 눌러 주세요.");
}
cameraModeBtn.onclick=()=>setMode("camera");
scannerModeBtn.onclick=()=>setMode("scanner");
document.getElementById("focusScannerBtn").onclick=async()=>{await unlockMobileAudio();scannerInput.focus();status("스캐너 대기","외부 바코드 스캐너로 스캔해 주세요.");};
let scannerBuffer="",scannerTimer=null;
scannerInput.addEventListener("input",()=>{
  scannerBuffer=scannerInput.value;
  clearTimeout(scannerTimer);
  scannerTimer=setTimeout(()=>{
    const v=scannerBuffer.trim(); scannerInput.value=""; scannerBuffer="";
    if(v) playSuccess(v,"external_scanner");
    setTimeout(()=>scannerInput.focus(),50);
  },120);
});
scannerInput.addEventListener("keydown",e=>{
  if(e.key==="Enter"||e.key==="Tab"){
    e.preventDefault(); clearTimeout(scannerTimer);
    const v=scannerInput.value.trim(); scannerInput.value=""; scannerBuffer="";
    if(v) playSuccess(v,"external_scanner");
    setTimeout(()=>scannerInput.focus(),50);
  }
});
document.addEventListener("click",()=>{if(scanMode==="scanner")setTimeout(()=>scannerInput.focus(),0)});

document.getElementById("clearLog").onclick=()=>{
  if(confirm("저장된 스캔 기록을 모두 삭제하시겠습니까?")){
    localStorage.removeItem(LOG_KEY);
    renderScanLog();
  }
};
renderScanLog();
const totalSeatsInput=document.getElementById("totalSeatsInput");
totalSeatsInput.value=localStorage.getItem("jibs_total_seats")||"";
totalSeatsInput.addEventListener("input",()=>{
  const v=parseInt(totalSeatsInput.value||"0",10);
  if(v>0)localStorage.setItem("jibs_total_seats",String(v));
  else localStorage.removeItem("jibs_total_seats");
  renderBoarding();
});
renderBoarding();
document.getElementById("startBtn").onclick=async()=>{
  await unlockMobileAudio();
  await startCamera();
  status("스캔 대기","바코드 또는 QR코드를 비춰 주세요. · 효과음 활성화됨");
};
document.getElementById("switchBtn").onclick=async()=>{
  await unlockMobileAudio();
  facing=facing==="environment"?"user":"environment";
  await startCamera();
};
window.addEventListener("load",()=>status("시작 준비","스캔 방식을 선택해 주세요."));
</script>
